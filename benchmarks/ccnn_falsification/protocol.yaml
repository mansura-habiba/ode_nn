      "corrupted_object": "model_parameter",
      "no_domain_gate": true,
      "minimum_abs_fault_headroom_mse": 0.001,
      "minimum_relative_fault_headroom": 0.1,
      "primary_metric": "fault-specific excess improvement over no-fault placebo subject to independently tested source preservation",
      "required_controls": [
        "no_edit",
        "placebo_continued_adam",
        "structured_edit",
        "tangent_edit",
        "sparse_adam",
        "gauss_newton",
        "selective_kalman",
        "low_rank",
        "full_fir",
        "full_finetune"
      ],
      "allowable_updated_parameter_budgets": [
        1,
        5,
        18,
        36,
        56
      ],
      "preservation_max_relative_degradation": 0.1,
      "preservation_max_absolute_degradation_mse": 0.0001,
      "maximum_false_positive_no_fault_rate": 0.05,
      "negative_controls": [
        "no_fault",
        "wrong_family",
        "random_equal_norm_corruption",
        "random_repair_surface",
        "identical_input_contradictory_label_impossibility_only"
      ],
      "diagnostics": [
        "clean_checkpoint_hash",
        "faulted_checkpoint_hash",
        "fault_headroom",
        "fault_improvement",
        "placebo_improvement",
        "specificity_excess",
        "source_drift",
        "test_preservation_pass",
        "accepted_edit_status"
      ],
      "fault_oracle_visibility": "evaluator_only; never available to repair methods"
    }
  },
  "sample_splits": {
    "train_seed_offset": 100,
    "validation_seed_offset": 200,
    "calibration_seed_offset": 250,
    "locked_test_seed_offset": 300,
