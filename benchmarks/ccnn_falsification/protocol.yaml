    "RQ1-M": {
      "mechanism": "incremental CCNN causal lag memory alongside a shared attention backbone",
      "hypothesis": "CCNN improves the unmatched-family paired test error versus strongest predeclared non-CCNN competitor at comparable budget",
      "primary_metric": "seed-paired held-out MSE difference; lower is better",
      "required_controls": [
        "attention_only",
        "static_fir",
        "affine_dynamic_fir",
        "mlp_dynamic_fir",
        "ssm",
        "generic_neural_ode"
      ],
      "positive_calibration_only": [
        "matched_chirp"
      ],
      "primary_families": [
        "bimodal",
        "boxcar",
        "damped_oscillator",
        "switching",
        "feedback_ode"
      ],
      "benchmark_arms": [
        "frozen_backbone_residual_only",
        "joint_training"
      ],
      "negative_controls": [
        "no_conditional_memory",
        "shuffled_query",
        "randomized_lag_assignment"
      ],
      "reporting": [
        "per_family_seed_results",
        "paired_effect_size",
        "paired_confidence_interval",
        "compute_accuracy_pareto",
        "negative_outcomes"
      ]
    },
    "RQ6-M": {
      "mechanism": "blinded repair of actual model-weight corruption from a fixed clean checkpoint, not teacher-label alteration",
