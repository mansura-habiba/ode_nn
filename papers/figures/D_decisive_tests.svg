<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1430 430" role="img" aria-label="D — Decisive falsification tests and evidence boundaries"><defs><marker id="arr" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0 L10 4.5 L0 9 Z" fill="#294857"/></marker></defs><rect width="1430" height="430" fill="#fff"/><rect width="1430" height="53" fill="#e2f1ee"/><text x="25" y="35" font-size="23" font-weight="700" fill="#152c3e">D — Decisive falsification tests and evidence boundaries</text><g font-family="Arial, Helvetica, sans-serif" fill="#142b3c"><rect x="24" y="88" width="433" height="240" rx="14" fill="#e7f4f5" stroke="#7c9ba9" stroke-width="1.5"/><text x="240.5" y="115" text-anchor="middle" font-size="17" font-weight="700">1 · Unmatched generators</text><text x="240.5" y="140" font-size="14" text-anchor="middle">Bimodal, boxcar, damped oscillator</text><text x="240.5" y="162" font-size="14" text-anchor="middle">Switching, feedback ODE</text><text x="240.5" y="184" font-size="14" text-anchor="middle">Also test genuinely independent dynamics</text><text x="240.5" y="206" font-size="14" text-anchor="middle">Do not treat kernel mismatch as full</text><text x="240.5" y="228" font-size="14" text-anchor="middle">dynamical independence</text><rect x="500" y="88" width="433" height="240" rx="14" fill="#e8eef9" stroke="#7c9ba9" stroke-width="1.5"/><text x="716.5" y="115" text-anchor="middle" font-size="17" font-weight="700">2 · Comparable repair capacity</text><text x="716.5" y="140" font-size="14" text-anchor="middle">B = 1, 5, 18, 36, 56 scalars</text><text x="716.5" y="162" font-size="14" text-anchor="middle">Structured (B&gt;5 = hybrid)</text><text x="716.5" y="184" font-size="14" text-anchor="middle">Spectral / rank-1 / rank-2 / full</text><text x="716.5" y="206" font-size="14" text-anchor="middle">Same frozen CCNN base</text><text x="716.5" y="228" font-size="14" text-anchor="middle">Report compute and optimization geometry</text><rect x="976" y="88" width="433" height="240" rx="14" fill="#f7e9f0" stroke="#7c9ba9" stroke-width="1.5"/><text x="1192.5" y="115" text-anchor="middle" font-size="17" font-weight="700">3 · Loss landscape diagnostics</text><text x="1192.5" y="140" font-size="14" text-anchor="middle">2-D validation slices and paths</text><text x="1192.5" y="162" font-size="14" text-anchor="middle">Curvature, conditioning, basins</text><text x="1192.5" y="184" font-size="14" text-anchor="middle">Source retention boundary</text><text x="1192.5" y="206" font-size="14" text-anchor="middle">Planned measurement — NOT V3 data</text><text x="1192.5" y="228" font-size="14" text-anchor="middle">Show empirical landscapes only after run</text><text x="40" y="365" font-size="18" fill="#23323b">Outcome reporting: shifted test recovery + source test retention + no-fault false positives + per-seed uncertainty.</text><text x="40" y="401" font-size="16" fill="#23323b">Illustrative scientific architecture; no result or numerical advantage is asserted by the artwork.</text></g></svg>