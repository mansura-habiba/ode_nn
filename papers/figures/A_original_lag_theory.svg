<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 355" role="img" aria-label="A — Original coupled causal lag PDE–ODE (2021)"><defs><marker id="arr" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0 L10 4.5 L0 9 Z" fill="#294857"/></marker></defs><rect width="1160" height="355" fill="#fff"/><rect width="1160" height="53" fill="#e2f1ee"/><text x="25" y="35" font-size="23" font-weight="700" fill="#152c3e">A — Original coupled causal lag PDE–ODE (2021)</text><g font-family="Arial, Helvetica, sans-serif" fill="#142b3c"><rect x="30" y="105" width="225" height="123" rx="14" fill="#e6f5fc" stroke="#7c9ba9" stroke-width="1.5"/><text x="142.5" y="132" text-anchor="middle" font-size="17" font-weight="700">Historical state</text><text x="142.5" y="157" font-size="14" text-anchor="middle">y(t − τ)</text><text x="142.5" y="179" font-size="14" text-anchor="middle">Causal delay</text><rect x="330" y="105" width="285" height="123" rx="14" fill="#f4e8f6" stroke="#7c9ba9" stroke-width="1.5"/><text x="472.5" y="132" text-anchor="middle" font-size="17" font-weight="700">Lag accumulation</text><text x="472.5" y="157" font-size="14" text-anchor="middle">∂τu = Kθ(τ,t)y(t−τ)</text><text x="472.5" y="179" font-size="14" text-anchor="middle">u(t,0) = 0</text><rect x="689" y="105" width="208" height="123" rx="14" fill="#e9f5e9" stroke="#7c9ba9" stroke-width="1.5"/><text x="793" y="132" text-anchor="middle" font-size="17" font-weight="700">Boundary response</text><text x="793" y="157" font-size="14" text-anchor="middle">u(t,T)</text><rect x="959" y="105" width="175" height="123" rx="14" fill="#fff0e4" stroke="#7c9ba9" stroke-width="1.5"/><text x="1046.5" y="132" text-anchor="middle" font-size="17" font-weight="700">ODE evolution</text><text x="1046.5" y="157" font-size="14" text-anchor="middle">dy/dt = f(u(t,T))</text><path d="M 255 166 L 330 166" fill="none" stroke="#294857" stroke-width="2.5" marker-end="url(#arr)"/><path d="M 615 166 L 689 166" fill="none" stroke="#294857" stroke-width="2.5" marker-end="url(#arr)"/><path d="M 897 166 L 959 166" fill="none" stroke="#294857" stroke-width="2.5" marker-end="url(#arr)"/><text x="31" y="278" font-size="17" fill="#23323b">The delay term requires a history representation. The lag axis τ is not physical time t.</text><text x="31" y="309" font-size="16" fill="#23323b">Illustration of source theory; V3 uses observed x(t−τ), not this closed-loop y history.</text></g></svg>