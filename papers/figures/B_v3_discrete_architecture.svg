<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 390" role="img" aria-label="B — V3 implemented attention-augmented discrete surrogate"><defs><marker id="arr" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0 L10 4.5 L0 9 Z" fill="#294857"/></marker></defs><rect width="1420" height="390" fill="#fff"/><rect width="1420" height="53" fill="#e2f1ee"/><text x="25" y="35" font-size="23" font-weight="700" fill="#152c3e">B — V3 implemented attention-augmented discrete surrogate</text><g font-family="Arial, Helvetica, sans-serif" fill="#142b3c"><rect x="25" y="112" width="180" height="110" rx="14" fill="#d8f5fb" stroke="#7c9ba9" stroke-width="1.5"/><text x="115" y="139" text-anchor="middle" font-size="17" font-weight="700">Input</text><text x="115" y="164" font-size="14" text-anchor="middle">x(t), q(t)</text><rect x="265" y="100" width="228" height="130" rx="14" fill="#e8edfb" stroke="#7c9ba9" stroke-width="1.5"/><text x="379" y="127" text-anchor="middle" font-size="17" font-weight="700">Causal history</text><text x="379" y="152" font-size="14" text-anchor="middle">H(t,j) = x(t−j)</text><text x="379" y="174" font-size="14" text-anchor="middle">zero prehistory</text><rect x="550" y="100" width="215" height="130" rx="14" fill="#f1eafd" stroke="#7c9ba9" stroke-width="1.5"/><text x="657.5" y="127" text-anchor="middle" font-size="17" font-weight="700">Conditional kernel</text><text x="657.5" y="152" font-size="14" text-anchor="middle">Kθ(j,q)</text><text x="657.5" y="174" font-size="14" text-anchor="middle">14 discrete lags</text><rect x="815" y="100" width="235" height="130" rx="14" fill="#f2ebfb" stroke="#7c9ba9" stroke-width="1.5"/><text x="932.5" y="127" text-anchor="middle" font-size="17" font-weight="700">Lag cumulative sum</text><text x="932.5" y="152" font-size="14" text-anchor="middle">u(t,j) = Σ k≤j K H</text><text x="932.5" y="174" font-size="14" text-anchor="middle">m(t) = u(t,L−1)</text><rect x="1104" y="100" width="273" height="130" rx="14" fill="#e9f6ed" stroke="#7c9ba9" stroke-width="1.5"/><text x="1240.5" y="127" text-anchor="middle" font-size="17" font-weight="700">Leaky state</text><text x="1240.5" y="152" font-size="14" text-anchor="middle">z ← (1−α)z + α tanh(2m)</text><text x="1240.5" y="174" font-size="14" text-anchor="middle">exponential time step</text><path d="M 205 160 L 265 160" fill="none" stroke="#294857" stroke-width="2.5" marker-end="url(#arr)"/><path d="M 493 160 L 550 160" fill="none" stroke="#294857" stroke-width="2.5" marker-end="url(#arr)"/><path d="M 765 160 L 815 160" fill="none" stroke="#294857" stroke-width="2.5" marker-end="url(#arr)"/><path d="M 1050 160 L 1104 160" fill="none" stroke="#294857" stroke-width="2.5" marker-end="url(#arr)"/><rect x="405" y="270" width="300" height="83" rx="14" fill="#def2e4" stroke="#7c9ba9" stroke-width="1.5"/><text x="555" y="297" text-anchor="middle" font-size="17" font-weight="700">Self-attention</text><text x="555" y="322" font-size="14" text-anchor="middle">Aφ(x,q)</text><rect x="905" y="270" width="355" height="83" rx="14" fill="#fce7e7" stroke="#7c9ba9" stroke-width="1.5"/><text x="1082.5" y="297" text-anchor="middle" font-size="17" font-weight="700">Prediction</text><text x="1082.5" y="322" font-size="14" text-anchor="middle">ŷ = attention + learned gain · z</text><path d="M 555 230 L 555 270" fill="none" stroke="#294857" stroke-width="2.5" marker-end="url(#arr)"/><path d="M 705 312 L 905 312" fill="none" stroke="#294857" stroke-width="2.5" marker-end="url(#arr)"/><path d="M 1240 230 L 1120 270" fill="none" stroke="#294857" stroke-width="2.5" marker-end="url(#arr)"/><text x="26" y="372" font-size="15" fill="#23323b">Fixed sampling grid; this is not an adaptive continuous-time solver.</text></g></svg>