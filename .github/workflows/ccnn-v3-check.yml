name: CCNN V3 reproducibility check

on:
  push:
    branches:
      - research/ccnn-v3-falsification-executable
    paths:
      - 'benchmarks/ccnn_falsification/**'
      - 'notebooks/CCNN_Unmatched_Kernels_Gatefree_Repair_V3_Colab.ipynb'
      - '.github/workflows/ccnn-v3-check.yml'
  workflow_dispatch:

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy matplotlib
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Unit/invariant tests
        run: |
          python -m unittest discover -v -s benchmarks/ccnn_falsification -p 'test_*.py'
      - name: Fast execution benchmark (1 seed, 3 families)
        run: |
          python benchmarks/ccnn_falsification/ccnn_generalization_benchmark.py \
            --profile smoke --seeds 1 --epochs 2 --steps 3 \
            --out /tmp/ccnn_v3_fast
          python - <<'PY'
          import csv, json
          from pathlib import Path
          p=Path('/tmp/ccnn_v3_fast')
          arch=list(csv.DictReader((p/'architecture.csv').open()))
          rows=list(csv.DictReader((p/'repair.csv').open()))
          neg=list(csv.DictReader((p/'no_defect.csv').open()))
          print('RUN SUMMARY',json.dumps({'architecture_rows':len(arch),'repair_rows':len(rows),'no_defect_rows':len(neg),'architectures':sorted({r['kind'] for r in arch}), 'methods':sorted({r['method'] for r in rows}), 'families':sorted({r['family'] for r in rows}), 'source_passes':sum(r['independent_source_pass']=='True' for r in rows)},sort_keys=True))
          assert len(arch)==15 and len(rows)==45 and len(neg)==15
          assert all((p/n).exists() for n in ('manifest.json','Figure_00_Unmatched_Teacher_Kernels.png','Figure_01_Coupled_PDE_ODE_Architecture.pdf','Figure_02_Repair_Tradeoffs.svg'))
          with open('/tmp/ccnn_v3_fast_summary.md','w') as f:
              f.write('# CCNN V3 fast execution\n\n**Status:** fast smoke only, 1 seed / 2 epochs / 3 steps, not scientific evidence.\n\n')
              f.write('| Teacher | Architecture | Test MSE |\n|---|---|---:|\n')
              for r in arch: f.write(f"| {r['family']} | {r['kind']} | {float(r['test_mse']):.5g} |\n")
          PY
      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ccnn-v3-fast-evidence
          path: |
            /tmp/ccnn_v3_fast
            /tmp/ccnn_v3_fast_summary.md
          if-no-files-found: warn
