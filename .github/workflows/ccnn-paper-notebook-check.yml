name: CCNN paper-style Zoology MQAR notebook protocol check

on:
  push:
    branches: [research/ccnn-v3-falsification-executable]
    paths:
      - 'notebooks/CCNN_Attention_Weight_Space_Repair_Paper_Colab.ipynb'
      - 'notebooks/CCNN_Weight_Repair_Boundary_Colab.ipynb'
      - '.github/workflows/ccnn-paper-notebook-check.yml'
  pull_request:
    branches: [master]
    paths:
      - 'notebooks/CCNN_Attention_Weight_Space_Repair_Paper_Colab.ipynb'
      - 'notebooks/CCNN_Weight_Repair_Boundary_Colab.ipynb'
      - '.github/workflows/ccnn-paper-notebook-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notebook-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic CPU smoke dependencies
        run: |
          python -m pip install numpy pandas matplotlib nbformat nbclient ipykernel
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Execute pinned official Zoology MQAR generator and entire notebook
        env:
          MPLBACKEND: Agg
        run: |
          python - <<'PY'
          import nbformat
          from nbclient import NotebookClient
          from pathlib import Path
          import json,pandas as pd
          path=Path('notebooks/CCNN_Attention_Weight_Space_Repair_Paper_Colab.ipynb')
          nb=nbformat.read(path,as_version=4)
          md='\n'.join(c.source for c in nb.cells if c.cell_type=='markdown')
          for heading in ('Abstract','Research question','Source basis','Published',
                          'Experimental','Results A','Results B','Discussion','Primary source references'):
              assert heading.lower() in md.lower(),f'Missing scientific section: {heading}'
          code='\n'.join(c.source for c in nb.cells if c.cell_type=='code')
          assert 'MODE = "SMOKE"' in code
          assert 'https://raw.githubusercontent.com/HazyResearch/zoology/' in code
          assert 'official_mqar' in code and 'ICLR24_TRAIN' in code
          assert 'RANDOM_NON_QUERIES' in code and 'official_mqar' in code
          assert 'ICLR24_TRAIN' in code and 'ICLR24_TEST' in code
          executed=NotebookClient(nb,timeout=1200,kernel_name='python3',allow_errors=False).execute(cwd='.')
          cells=[c for c in executed.cells if c.cell_type=='code']
          assert len(cells)>=7 and all(c.execution_count is not None for c in cells)
          out=Path('ccnn_zoology_paper_outputs')
          required=['architecture_per_configuration.csv','learning_curves.csv',
                    'fault_calibration.csv','repair_per_method.csv',
                    'experiment_manifest.json','paired_seed_effects.csv','repair_seed_effects.csv',
                    'Figure_01_Official_MQAR_Recall.png',
                    'Figure_02_Repair_Preservation.png']
          for name in required:assert (out/name).is_file(),f'Missing {name}'
          manifest=json.loads((out/'experiment_manifest.json').read_text())
          assert manifest['official_zoology_revision']=='1ad20d193b6113cae1e8f3c655c300d7b4b3f4bb'
          assert manifest['canonical_mqar_generator'] is True
          assert manifest['scientifically_validated'] is False
          assert manifest['status']=='engineering_smoke'
          assert manifest['published_train_specs']==[[128,8,100000],[64,4,100000],[256,16,100000]]
          assert manifest['published_test_specs']==[[128,8,3000],[64,4,3000],[256,16,3000]]
          assert manifest['published_widths']==[64,128,256,512]
          assert len(manifest['extended_repo_test_specs'])==7
          assert manifest['random_non_queries'] is False
          a=pd.read_csv(out/'architecture_per_configuration.csv')
          b=pd.read_csv(out/'repair_per_method.csv')
          assert len(a)==6 and len(b)==8,(len(a),len(b))
          assert set(a.kind)=={'attention','ccnn','fir'}
          assert all(b.status=='engineering_smoke'), "Smoke must not report repair efficacy"
          effects=pd.read_csv(out/'paired_seed_effects.csv')
          assert len(effects)==6 and effects.ci_low.isna().all(), 'One-seed smoke cannot estimate CI'
          print('OFFICIAL_ZOOLOGY_PROTOCOL_SMOKE',json.dumps(dict(
              code_cells=len(cells),architecture_rows=len(a),repair_rows=len(b),
              upstream_commit=manifest['official_zoology_revision'],
              generator_hash=manifest['upstream_generator_sha256'],
              evidence=manifest['status']),sort_keys=True))
          nbformat.write(executed,'ccnn_zoology_executed_smoke.ipynb')
          PY
      - name: Execute focused weight-repair boundary notebook in engineering smoke mode
        env:
          MPLBACKEND: Agg
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import nbformat
          import pandas as pd
          from nbclient import NotebookClient
          path=Path("notebooks/CCNN_Weight_Repair_Boundary_Colab.ipynb")
          nb=nbformat.read(path,as_version=4)
          assert 'MODE = "SMOKE"' in '\n'.join(c.source for c in nb.cells if c.cell_type=='code')
          nb=NotebookClient(nb,timeout=1200,kernel_name="python3",allow_errors=False).execute(cwd=".")
          out=Path("ccnn_weight_repair_boundary_outputs")
          for name in ("all_fault_method_trials.csv","evaluator_fault_ledger_DO_NOT_GIVE_EDITOR.csv",
                       "checkpoint_readiness.csv","clean_training_curves.csv","experiment_manifest.json",
                       "Figure_01_Repair_Boundary.png"):
              assert (out/name).is_file(),name
          trial=pd.read_csv(out/"all_fault_method_trials.csv")
          ledger=pd.read_csv(out/"evaluator_fault_ledger_DO_NOT_GIVE_EDITOR.csv")
          cfg=json.loads((out/"experiment_manifest.json").read_text())
          assert len(trial)==24 and len(ledger)==4,(len(trial),len(ledger))
          assert set(trial.method)=={"structured5","tangent5","fir5","fir_full","adam_sparse5","adam_full"}
          assert set(trial.status)=={"engineering_smoke"}
          assert cfg["claim_of_superiority"] is False
          print("REPAIR_BOUNDARY_SMOKE",json.dumps(dict(
              code_cells=sum(c.cell_type=="code" for c in nb.cells),
              trials=len(trial),fault_families=len(ledger),
              evidence=cfg["evidence_status"]),sort_keys=True))
          nbformat.write(nb,"ccnn_weight_repair_boundary_executed_smoke.ipynb")
          PY
      - name: Archive smoke artifacts (not scientific findings)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ccnn-zoology-official-generator-smoke
          path: |
            ccnn_zoology_paper_outputs/
            ccnn_zoology_executed_smoke.ipynb
            ccnn_weight_repair_boundary_outputs/
            ccnn_weight_repair_boundary_executed_smoke.ipynb
          if-no-files-found: warn
