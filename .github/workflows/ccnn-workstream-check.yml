name: CCNN integrated research component verification

on:
  push:
    branches:
      - research/ccnn-v3-falsification-executable
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-matrix:
    name: "Independent verification: ${{ matrix.workstream }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - workstream: protocol-5
            test: test_study_registration.py
          - workstream: independent-teachers-6
            test: test_independent_teachers.py
          - workstream: strong-fir-7
            test: test_strong_fir_baseline.py
          - workstream: blinded-faults-10
            test: test_blinded_fault_injection.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU test dependencies
        run: |
          python -m pip install numpy matplotlib
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile Python sources
        run: python -m compileall -q benchmarks/ccnn_falsification
      - name: Run workstream invariant suite
        run: python -m unittest discover -v -s benchmarks/ccnn_falsification -p "${{ matrix.test }}"

  verify-integrated:
    name: Unified suite (all workstreams together)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU test dependencies
        run: |
          python -m pip install numpy matplotlib pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile Python sources
        run: python -m compileall -q benchmarks/ccnn_falsification
      - name: All new and inherited unit/invariant tests
        run: python -m unittest discover -v -s benchmarks/ccnn_falsification -p 'test_*.py'
      - name: Legacy pytest-style protocol checks
        run: python -m pytest -q benchmarks/ccnn_falsification/test_protocol.py
      - name: Check Colab notebook matches repo Python benchmark code
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('benchmarks/ccnn_falsification')
          p=Path('notebooks/CCNN_Unmatched_Kernels_Gatefree_Repair_V3_Colab.ipynb')
          notebook=json.loads(p.read_text())
          scripts=[ ''.join(c.get('source',[])) for c in notebook['cells'] if c.get('cell_type')=='code' ]
          target=(root/'ccnn_generalization_benchmark.py').read_text()
          # Colab must omit the CLI auto-run entrypoint; otherwise Jupyter injects
          # its kernel '-f ...json' flags and argparse fails. Compare all shared
          # definitions, allowing ONLY this deliberate suffix substitution.
          suffix="if __name__=='__main__':\n    benchmark_cli()\n"
          assert target.endswith(suffix), 'Unexpected standalone CLI entrypoint'
          shared=target[:-len(suffix)]
          assert any(code.startswith(shared) and code[len(shared):].strip() ==
              '# Colab/Jupyter: do not auto-run benchmark_cli() here.\n# Execute the next experiment cell to select smoke/full explicitly.'
              for code in scripts), 'V3 notebook and standalone definitions diverged'
          print('V3 shared definitions match; Colab CLI entrypoint intentionally disabled')
          PY
